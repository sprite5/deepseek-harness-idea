name: Build Preview

on:
  workflow_dispatch:
  push:
    branches:
      - 'preview/**'
    tags:
      - 'v0.1.7-preview.*'

permissions:
  contents: read

env:
  # Node 20 已被 GitHub Actions 弃用 (2025-09-19)，现在默认是 Node 24
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  JAVA_VERSION: '21'
  NPM_REGISTRY: 'https://registry.npmmirror.com/'
  DSH_VERSION: '0.1.1-rc.2'
  HANUI_VERSION: '0.2.5'

jobs:
  build:
    name: build/universal
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Build dsh tree (universal, no node bundled)
        env:
          NPM_CONFIG_FETCH_TIMEOUT: '120000'
          NPM_CONFIG_FETCH_RETRIES: '3'
          NPM_CONFIG_LOGLEVEL: 'warn'
        run: |
          node scripts/build-dsh.mjs \
            --registry "${{ env.NPM_REGISTRY }}" \
            --dsh-version "${{ env.DSH_VERSION }}" \
            --hanui-version "${{ env.HANUI_VERSION }}" \
            --bundle

      - name: Build plugin zip
        run: ./gradlew buildPlugin --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-universal
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 60

  release:
    name: publish release (tag only)
    if: startsWith(github.ref, 'refs/tags/v0.1.7-preview')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
          prerelease: true
