name: Build Preview

on:
  workflow_dispatch:
  push:
    branches:
      - 'preview/**'
    tags:
      - 'v*'

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  NPM_REGISTRY: 'https://registry.npmmirror.com/'
  DSH_VERSION: '0.1.2-rc.1'
  HANUI_VERSION: '0.2.5'

jobs:
  build:
    name: build/universal
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # 缓存 dsh 基础树（~190 JS 包 + 18 native prebuild tarballs）
      # 版本变才失效，否则全量命中
      - name: Cache dsh tree
        uses: actions/cache@v4
        with:
          path: |
            build/dsh
            build/pack-cache
          key: dsh-tree-${{ env.DSH_VERSION }}-${{ env.HANUI_VERSION }}
          restore-keys: |
            dsh-tree-${{ env.DSH_VERSION }}-
            dsh-tree-

      - uses: actions/setup-node@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # 先用 prepare 脚本装 dsh 基础树（命中缓存秒过；未命中跑 npm install 到 build/dsh/dsh/）
      # 这样 build-dsh.mjs 的 Stage 1 会复用现有 tree，跳过它自己的 npm install fallback
      - name: Prepare dsh base tree
        run: |
          node scripts/prepare-dsh-cache.mjs \
            --registry "${{ env.NPM_REGISTRY }}" \
            --dsh-version "${{ env.DSH_VERSION }}" \
            --hanui-version "${{ env.HANUI_VERSION }}"

      # build-dsh.mjs 主要做 native prebuild 补齐（Stage 2）+ 打 zip（Stage 4）
      # Stage 1 看到 build/dsh/dsh/ 已存在会直接跳过
      - name: Build dsh tree + bundle zip
        env:
          NPM_CONFIG_FETCH_TIMEOUT: '120000'
          NPM_CONFIG_FETCH_RETRIES: '3'
          NPM_CONFIG_LOGLEVEL: 'warn'
        run: |
          node scripts/build-dsh.mjs \
            --registry "${{ env.NPM_REGISTRY }}" \
            --dsh-version "${{ env.DSH_VERSION }}" \
            --hanui-version "${{ env.HANUI_VERSION }}" \
            --bundle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build plugin zip
        run: ./gradlew buildPlugin --no-daemon

      # buildPlugin 产物名是 <plugin-name>-<version>.zip；改名为 <plugin-name>-<version>-dsh-<dsh-version>.zip
      - name: Rename zip with dsh version
        run: |
          PLUGIN_VERSION=$(node -e 'const m = fs.readFileSync("build.gradle.kts", "utf8").match(/version\s*=\s*"([^"]+)"/); console.log(m ? m[1] : "unknown");')
          echo "Plugin Version: ${PLUGIN_VERSION}"
          echo "DSH Version: ${{ env.DSH_VERSION }}"
          TARGET_NAME="dsh-idea-simple-${PLUGIN_VERSION}+dsh${{ env.DSH_VERSION }}.zip"
          cd build/distributions
          ORIGINAL_ZIP=$(ls dsh-idea-simple-*.zip | head -n 1)
          echo "Renaming ${ORIGINAL_ZIP} to ${TARGET_NAME}"
          mv "${ORIGINAL_ZIP}" "${TARGET_NAME}"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-universal
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 60

  release:
    name: publish release (tag only)
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-preview')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
          prerelease: true

