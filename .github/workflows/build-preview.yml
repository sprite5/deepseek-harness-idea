# v0.1.7 preview CI：单 ubuntu runner 构建单一 universal 插件 zip，覆盖
# win-x64/win-arm64 + macos-x64/macos-arm64 + linux-x64/linux-arm64 全平台用户。
#
# 为什么用 ubuntu（不用 mac / win）：
#   - npm install 大型依赖树（dsh ~190 包 + 6 套 native prebuild）时
#     ubuntu-22.04 Linux 容器最稳、最快、sharp/koffi 全平台预编译都有。
#   - macos runner 上 npm 偶尔挂 optional dep 解析、symlink/权限怪事较多。
#   - 单 runner → 单 zip → 单 Release：CI 资源与维护成本最低。
#
# 触发：
#   - push branch `preview/**`    → 构建 + 上传 artifact（不打 Release）
#   - push tag `v0.1.7-preview.*` → 构建 + 上传 artifact + 创建 prerelease
#   - workflow_dispatch           → 手动触发（测试用）
#
# 产物：build/distributions/dsh-idea-simple-universal-<ver>.zip（约 90-100 MB）
# 体积比单平台大（含 6 套 native prebuild），但任何 OS/arch 用户都能直接装。
name: Build Preview

on:
  workflow_dispatch:
  push:
    branches:
      - 'preview/**'
    tags:
      - 'v0.1.7-preview.*'

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '21'
  NPM_REGISTRY: 'https://registry.npmmirror.com/'
  DSH_VERSION: '0.1.1-rc.2'
  HANUI_VERSION: '0.2.5'

jobs:
  build:
    name: build/universal
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # 1) 构建 universal dsh 树（不含 node；npm install 不传 --os/--cpu，
      #    让 sharp/koffi/node-addon-require-builtin/node-pty 全平台 prebuild 都装上）
      - name: Build dsh tree (universal, no node bundled)
        env:
          NPM_CONFIG_FETCH_TIMEOUT: '120000'
          NPM_CONFIG_FETCH_RETRIES: '3'
          NPM_CONFIG_LOGLEVEL: 'warn'
        run: |
          node scripts/build-dsh.mjs \
            --registry "${{ env.NPM_REGISTRY }}" \
            --dsh-version "${{ env.DSH_VERSION }}" \
            --hanui-version "${{ env.HANUI_VERSION }}" \
            --bundle

      # 2) 打包插件 zip（bundleDsh 把 build/dsh.zip 重命名为 dsh-bundle.zip 打进资源）
      - name: Build plugin zip
        run: ./gradlew buildPlugin --no-daemon

      # 3) 上传产物（tag 推送时由 release job 下载附到 Release）
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-universal
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 60

  release:
    name: publish release (tag only)
    if: startsWith(github.ref, 'refs/tags/v0.1.7-preview')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
          prerelease: true